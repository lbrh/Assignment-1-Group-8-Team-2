name: CI

on:
    pull_request:
        branches: [main]

jobs:
    frontend-ci:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with: 
                node-version: 24
            - run: corepack enable
            - run: pnpm install --frozen-lockfile
            - run: pnpm lint
            - run: pnpm exec tsc --noEmit
            - run: pnpm build
            - run: pnpm test
            
    backend-ci:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: backend
        steps: 
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: 24
            - run: npm install
            - run: npx tsc --noEmit
            - run: npm test
